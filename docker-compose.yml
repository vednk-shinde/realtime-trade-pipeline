services:
  kafka:
    image: apache/kafka:3.8.0   # KRaft mode, no ZooKeeper
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_LOG_RETENTION_HOURS: 24
    ports: ["29092:29092"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      retries: 20

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trades
      POSTGRES_USER: pipeline
      POSTGRES_PASSWORD: pipeline
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "synchronous_commit=off"]
    volumes:
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipeline -d trades"]
      interval: 5s
      retries: 20

  producer:
    build: { context: ., dockerfile: docker/Dockerfile.python }
    command: ["python", "-m", "producer.producer"]
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      SOURCE: ${SOURCE:-simulated}      # or: binance
      RATE: ${RATE:-5000}
    depends_on:
      kafka: { condition: service_healthy }

  spark:
    build: { context: ., dockerfile: docker/Dockerfile.spark }
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      PG_HOST: postgres
    depends_on:
      kafka: { condition: service_healthy }
      postgres: { condition: service_healthy }
    volumes: [checkpoints:/tmp/checkpoints]

  dashboard:
    build: { context: ., dockerfile: docker/Dockerfile.python }
    command: ["streamlit", "run", "dashboard/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    environment: { PG_HOST: postgres }
    ports: ["8501:8501"]
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata:
  checkpoints:
